[versions]
# ── Core ──
agp                    = "8.7.3"
kotlin                 = "2.1.0"
ksp                    = "2.1.0-1.0.29"

# ── AndroidX ──
core-ktx               = "1.15.0"
appcompat              = "1.7.0"
activity-compose       = "1.9.3"
lifecycle              = "2.8.7"
navigation-compose     = "2.8.5"
datastore              = "1.1.1"
room                   = "2.6.1"

# ── Compose ──
compose-bom            = "2024.12.01"
compose-compiler       = "1.5.15"

# ── Kotlin / Coroutines ──
coroutines             = "1.9.0"
kotlinx-serialization  = "1.7.3"
kotlinx-collections    = "0.3.8"

# ── DI ──
hilt                   = "2.53.1"
hilt-navigation        = "1.2.0"

# ── Media / Animation ──
lottie                 = "6.6.2"
media3                 = "1.5.1"

# ── Testing ──
junit                  = "4.13.2"
junit-ext              = "1.2.1"
espresso               = "3.6.1"
turbine                = "1.2.0"
coroutines-test        = "1.9.0"

# ── Quality ──
detekt                 = "1.23.7"

[libraries]
# ── AndroidX ──
core-ktx                = { group = "androidx.core",              name = "core-ktx",               version.ref = "core-ktx" }
appcompat               = { group = "androidx.appcompat",         name = "appcompat",               version.ref = "appcompat" }
activity-compose        = { group = "androidx.activity",          name = "activity-compose",        version.ref = "activity-compose" }
lifecycle-runtime       = { group = "androidx.lifecycle",         name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel     = { group = "androidx.lifecycle",         name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
navigation-compose      = { group = "androidx.navigation",       name = "navigation-compose",      version.ref = "navigation-compose" }
datastore-preferences   = { group = "androidx.datastore",        name = "datastore-preferences",   version.ref = "datastore" }

# Room
room-runtime            = { group = "androidx.room",             name = "room-runtime",            version.ref = "room" }
room-ktx                = { group = "androidx.room",             name = "room-ktx",                version.ref = "room" }
room-compiler           = { group = "androidx.room",             name = "room-compiler",           version.ref = "room" }

# ── Compose BOM ──
compose-bom             = { group = "androidx.compose",          name = "compose-bom",             version.ref = "compose-bom" }
compose-ui              = { group = "androidx.compose.ui",       name = "ui" }
compose-ui-graphics     = { group = "androidx.compose.ui",       name = "ui-graphics" }
compose-ui-tooling      = { group = "androidx.compose.ui",       name = "ui-tooling" }
compose-ui-preview      = { group = "androidx.compose.ui",       name = "ui-tooling-preview" }
compose-material3       = { group = "androidx.compose.material3", name = "material3" }
compose-animation       = { group = "androidx.compose.animation", name = "animation" }
compose-foundation      = { group = "androidx.compose.foundation", name = "foundation" }
compose-runtime         = { group = "androidx.compose.runtime",  name = "runtime" }
compose-ui-test-junit4  = { group = "androidx.compose.ui",       name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui",      name = "ui-test-manifest" }

# ── Kotlin / Coroutines ──
coroutines-core         = { group = "org.jetbrains.kotlinx",     name = "kotlinx-coroutines-core",    version.ref = "coroutines" }
coroutines-android      = { group = "org.jetbrains.kotlinx",     name = "kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test         = { group = "org.jetbrains.kotlinx",     name = "kotlinx-coroutines-test",    version.ref = "coroutines-test" }
kotlinx-serialization   = { group = "org.jetbrains.kotlinx",     name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-collections     = { group = "org.jetbrains.kotlinx",     name = "kotlinx-collections-immutable", version.ref = "kotlinx-collections" }

# ── DI ──
hilt-android            = { group = "com.google.dagger",         name = "hilt-android",            version.ref = "hilt" }
hilt-compiler           = { group = "com.google.dagger",         name = "hilt-android-compiler",   version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt",             name = "hilt-navigation-compose", version.ref = "hilt-navigation" }

# ── Media / Animation ──
lottie-compose          = { group = "com.airbnb.android",        name = "lottie-compose",          version.ref = "lottie" }
media3-exoplayer        = { group = "androidx.media3",           name = "media3-exoplayer",        version.ref = "media3" }
media3-session          = { group = "androidx.media3",           name = "media3-session",          version.ref = "media3" }

# ── Testing ──
junit                   = { group = "junit",                    name = "junit",                   version.ref = "junit" }
junit-ext               = { group = "androidx.test.ext",         name = "junit",                   version.ref = "junit-ext" }
espresso-core           = { group = "androidx.test.espresso",    name = "espresso-core",           version.ref = "espresso" }
turbine                 = { group = "app.cash.turbine",          name = "turbine",                 version.ref = "turbine" }

[plugins]
android-application     = { id = "com.android.application",      version.ref = "agp" }
android-library         = { id = "com.android.library",          version.ref = "agp" }
kotlin-android          = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm              = { id = "org.jetbrains.kotlin.jvm",     version.ref = "kotlin" }
kotlin-serialization    = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler        = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt                    = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp                     = { id = "com.google.devtools.ksp",      version.ref = "ksp" }
room                    = { id = "androidx.room",                version.ref = "room" }
